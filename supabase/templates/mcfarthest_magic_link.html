<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta name="color-scheme" content="light only" />
    <meta name="supported-color-schemes" content="light only" />
    <title>Sign in to McFarthest</title>
  </head>
  <body style="margin:0;padding:0;background:#f4f1ea;color:#1a1d23;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',system-ui,sans-serif;">
    <span style="display:none !important;opacity:0;color:transparent;height:0;width:0;overflow:hidden;visibility:hidden;">Your McFarthest code is {{ .Token }}. Single use, expires in an hour.</span>
    <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="background:#f4f1ea;padding:40px 16px;">
      <tr>
        <td align="center">
          <table role="presentation" width="560" cellpadding="0" cellspacing="0" border="0" style="max-width:560px;width:100%;">
            <tr>
              <td style="background:#ffffff;border:1px solid #e3ded2;border-radius:18px;padding:36px 32px;">
                <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0">
                  <tr>
                    <td align="center" style="padding-bottom:8px;">
                      <div style="font-size:13px;letter-spacing:0.16em;text-transform:uppercase;font-weight:700;color:#0F5257;">McFarthest</div>
                    </td>
                  </tr>
                  <tr>
                    <td align="center" style="padding:16px 8px 4px 8px;">
                      <div style="font-size:17px;line-height:1.45;color:#1a1d23;">Your sign-in code</div>
                    </td>
                  </tr>
                  <tr>
                    <td align="center" style="padding:8px 0 4px 0;">
                      <div style="font-size:40px;line-height:1.1;font-weight:800;letter-spacing:0.18em;color:#0F5257;font-family:ui-monospace,Menlo,monospace;">{{ .Token }}</div>
                    </td>
                  </tr>
                  <tr>
                    <td align="center" style="padding:4px 8px 0 8px;">
                      <div style="font-size:14px;line-height:1.5;color:#5b6270;">Type it into the app, or tap the button on your phone.</div>
                    </td>
                  </tr>
                  <tr>
                    <td align="center" style="padding:24px 0 8px 0;">
                      <a href="{{ .ConfirmationURL }}" style="display:inline-block;background:#0F5257;color:#ffffff;text-decoration:none;font-weight:700;font-size:16px;padding:14px 28px;border-radius:12px;min-width:240px;text-align:center;">Open McFarthest →</a>
                    </td>
                  </tr>
                  <tr>
                    <td align="center" style="padding:8px 8px 0 8px;">
                      <div style="font-size:13px;line-height:1.5;color:#8a92a1;">Single use · expires in an hour</div>
                    </td>
                  </tr>
                </table>
              </td>
            </tr>
            <tr>
              <td style="padding:16px 8px 0 8px;">
                <p style="margin:0;font-size:12px;line-height:1.5;color:#8a92a1;text-align:center;">If you didn't ask to sign in to McFarthest, you can ignore this email.</p>
              </td>
            </tr>
          </table>
        </td>
      </tr>
    </table>
  </body>
</html>
